[MicMediaAutoPause]
; Comma-separated executable names whose microphone use should trigger pausing.
TriggerApps=msedge.exe

; 1 = pause every currently-playing Windows media session.
; 0 = pause only sessions matching MediaApps.
PauseAllMedia=1

; Optional comma-separated exclusions used when PauseAllMedia=1.
; Example: ExcludeMediaApps=discord,teams
ExcludeMediaApps=

; Optional comma-separated allowlist used only when PauseAllMedia=0.
; Example: MediaApps=spotify,msedge
MediaApps=

; How often to check the microphone-use state.
PollMs=150

; Wait this long after the microphone is released before resuming.
ResumeDelayMs=350

; 1 = write transition/error lines to MicMediaAutoPause.log, 0 = no log file.
Logging=1
